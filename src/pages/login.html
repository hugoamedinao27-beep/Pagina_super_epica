<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tienda Super Wai</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Tienda Super Wai</h1>
            <p class="subtitle">Sistema de Control de Asistencia</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required autocomplete="username" placeholder="correo@tienda.com">
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" required autocomplete="current-password" placeholder="Ingrese su contraseña">
                </div>
                <button type="submit" class="btn btn-primary" id="btnLogin">Iniciar sesión</button>
                <p class="error-msg" id="errorMsg" role="alert" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
