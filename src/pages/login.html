<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Tienda Super Wai</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Tienda Super Wai</h1>
            <p class="subtitle">Sistema de Control de Asistencia</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" required placeholder="correo@tienda.com">
                </div>
                <div class="form-group">
                    <label for="contrasena">Contrasena</label>
                    <input type="password" id="contrasena" required placeholder="Ingrese su contrasena">
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
                <p class="error-msg" id="errorMsg"></p>
            </form>
            <div class="login-footer">
                <p>No tienes cuenta? <a href="#" id="showRegister">Registrate aqui</a></p>
            </div>
        </div>
    </div>

    <div class="login-container" id="registerSection" style="display:none;">
        <div class="login-box">
            <h1>Crear Cuenta</h1>
            <p class="subtitle">Registrate como empleado</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regNombre">Nombre completo</label>
                    <input type="text" id="regNombre" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="regEmail">Correo electronico</label>
                    <input type="email" id="regEmail" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="regContrasena">Contrasena</label>
                    <input type="password" id="regContrasena" required placeholder="Crea una contrasena">
                </div>
                <div class="form-group">
                    <label for="regContrasena2">Confirmar contrasena</label>
                    <input type="password" id="regContrasena2" required placeholder="Repite tu contrasena">
                </div>
                <button type="submit" class="btn btn-primary">Crear Cuenta</button>
                <p class="error-msg" id="registerError"></p>
                <p class="success-msg" id="registerSuccess"></p>
            </form>
            <div class="login-footer">
                <p>Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesion</a></p>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
